name: BE Auto Deploy to Azure VM

on:
  push:
    branches:
      - main-be

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            BACKEND_DIR="/var/www/backend"
            AUTH_URL="https://${{ secrets.ACTIONS_PAT }}@github.com/${{ github.repository }}.git"

            echo "Preparing backend directory..."
            sudo mkdir -p $BACKEND_DIR
            sudo chown -R $USER:$USER $BACKEND_DIR

            cd $BACKEND_DIR

            if [ -d ".git" ]; then
              echo "Updating existing repository..."
              git remote set-url origin $AUTH_URL
              git fetch origin
              git reset --hard origin/main-be
              git clean -fd
            else
              echo "Cloning repository..."
              git clone -b main-be $AUTH_URL .
            fi

            echo "Stopping and removing old containers..."
            docker compose down --remove-orphans || true

            # Force remove conflicting containers
            for container in datahub-postgres-ig ig-solr sql_agent_redis; do
              if [ "$(docker ps -aq -f name=$container)" ]; then
                echo "Removing existing container $container..."
                docker rm -f $container
              fi
            done

            echo "Building and starting containers..."
            docker compose up -d --build

            echo "Configuring Solr schema..."
            bash configure_solr_schema.sh

            echo "Running indexing script..."
            docker exec datahub-unified-api python index_to_solr.py

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Deployment completed successfully!"
