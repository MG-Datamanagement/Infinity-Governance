name: BE Auto Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Backend via SSH
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << EOF
            set -e

            BACKEND_DIR="/var/www/backend"
            AUTH_URL="https://${{ secrets.ACTIONS_PAT }}@github.com/${{ github.repository }}.git"

            echo "Preparing backend directory..."
            sudo mkdir -p \$BACKEND_DIR
            sudo chown -R ${{ secrets.VM_USER }}:${{ secrets.VM_USER }} \$BACKEND_DIR

            cd \$BACKEND_DIR

            if [ -d ".git" ]; then
              echo "Updating existing repository..."
              git remote set-url origin \$AUTH_URL
              git fetch origin
              git reset --hard origin/main
              git clean -fd
            else
              echo "Cloning repository..."
              git clone -b main \$AUTH_URL .
            fi

            echo "Stopping old containers..."
            docker compose down || true

            echo "Building and starting containers..."
            docker compose up -d --build

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Deployment completed successfully!"
          EOF
